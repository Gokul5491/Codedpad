{% extends "base.html" %}
{% block title %}CodedPad - Saved{% endblock %}
{% block content %}

<section class="card center">
  <h2>Saved successfully!</h2>
  <p>Remember this key &mdash; it's the only way to get your data back:</p>
  <div class="code-box">{{ key }}</div>
  <p class="hint">It isn't stored anywhere, so if you lose it the data can't be recovered.</p>
  <a href="{{ url_for('home') }}" class="btn-secondary">Save another</a>
</section>

{% endblock %}
