{% extends "base.html" %}
{% block title %}CodedPad - Admin Login{% endblock %}
{% block content %}

<section class="card">
  <h2>Admin login</h2>
  <form action="{{ url_for('admin_login') }}" method="POST">
    <input type="password" name="password" placeholder="Admin password" required>
    <button type="submit">Log in</button>
  </form>
</section>

{% endblock %}
